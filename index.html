<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Trips</title>
  <style>
    :root {
      --ink: #1c1914;
      --muted: #6b6458;
      --line: #ddd6c8;
      --paper: #f6f1e7;
      --panel: #fffdf8;
      --accent: #8b3d2e;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      min-height: 100dvh;
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
    }

    main {
      width: min(720px, 100%);
      margin: 0 auto;
      padding: calc(28px + env(safe-area-inset-top)) 20px calc(40px + env(safe-area-inset-bottom));
    }

    .kicker {
      margin: 0 0 8px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    h1 {
      margin: 0;
      font-size: 40px;
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .lede {
      margin: 10px 0 28px;
      max-width: 36em;
      color: var(--muted);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 16px;
      line-height: 1.45;
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .card {
      display: block;
      padding: 18px 18px 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      color: inherit;
      text-decoration: none;
    }

    .card:active,
    .card:hover {
      border-color: var(--ink);
    }

    .where,
    .when {
      display: block;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .card strong {
      display: block;
      margin: 6px 0 8px;
      font-size: 24px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .blurb {
      display: block;
      margin-top: 8px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 14px;
      line-height: 1.45;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      h1 { font-size: 32px; }
      .card { padding: 16px; }
      .card strong { font-size: 22px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="kicker">Travel</p>
    <h1>Trips</h1>
    <p class="lede">Each trip has its own map and day plan. Open one, then switch between the plan and the map on your phone.</p>
    <div class="list" id="list"></div>
  </main>
  <script>
    fetch("trips.json")
      .then((response) => response.json())
      .then((trips) => {
        const list = document.getElementById("list");
        list.replaceChildren(...trips.map((trip) => {
          const link = document.createElement("a");
          link.className = "card";
          link.href = trip.href;
          const where = document.createElement("span");
          where.className = "where";
          where.textContent = trip.where;
          const title = document.createElement("strong");
          title.textContent = trip.title;
          const when = document.createElement("span");
          when.className = "when";
          when.textContent = trip.when;
          const blurb = document.createElement("span");
          blurb.className = "blurb";
          blurb.textContent = trip.blurb;
          link.append(where, title, when, blurb);
          return link;
        }));
      });
  </script>
</body>
</html>
