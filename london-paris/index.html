<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>London & Paris · 28 Oct – 8 Nov 2026</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <style>
    :root {
      --ink: #1c1914;
      --muted: #6b6458;
      --line: #ddd6c8;
      --paper: #f6f1e7;
      --panel: #fffdf8;
      --accent: #8b3d2e;
      --paris: #3d5a4c;
      --london: #2d4a6f;
      --transit: #8a6a2f;
      --hotel: #8b3d2e;
      --eat: #c0562a;
      --option: #5c4d7a;
      --shop: #c23b73;
      --walk: #2f7d46;
      --ride: #2d4a6f;
      --uber: #c47b2a;
      --cycle: #7b4dff;
      --loop: #2f7de1;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      max-width: 100%;
      overflow-x: clip;
    }
    body {
      font-family: Georgia, "Times New Roman", serif;
      color: var(--ink);
      background: var(--paper);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(300px, 380px) 1fr;
      height: 100%;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .brand {
      padding: 22px 22px 14px;
      border-bottom: 1px solid var(--line);
    }

    .brand p {
      margin: 0 0 6px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .brand h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand .dates {
      margin-top: 8px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: var(--muted);
    }

    .days {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 22px;
      border-bottom: 1px solid var(--line);
    }

    .days button {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 7px 12px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 12px;
      cursor: pointer;
    }

    .days button.active {
      background: var(--ink);
      color: #fffdf8;
      border-color: var(--ink);
    }

    .detail {
      flex: 1;
      min-width: 0;
      overflow-x: clip;
      overflow-y: auto;
      padding: 18px 22px 28px;
    }

    .detail h2,
    .lede,
    .event h3,
    .when,
    .hops,
    .event p,
    .nearby {
      overflow-wrap: anywhere;
    }

    .kicker {
      margin: 0 0 6px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .detail h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 600;
    }

    .lede {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.45;
    }

    .event {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 10px;
      padding: 12px 0;
      border-top: 1px solid var(--line);
    }

    .event h3 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .when {
      margin: 0 0 6px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
    }

    .hops {
      margin: 0 0 6px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.45;
    }

    .hops .walk { color: var(--walk); }
    .hops .transit { color: var(--ride); }
    .hops .uber { color: var(--uber); }
    .hops .cycle { color: var(--cycle); }

    .event p {
      margin: 0;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }

    .nearby {
      margin-top: 8px;
      padding: 8px 10px;
      background: #f7efe4;
      border: 1px solid var(--line);
      color: var(--ink);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 12px;
      line-height: 1.45;
    }

    .nearby em {
      display: block;
      margin-bottom: 3px;
      font-style: normal;
      font-size: 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--eat);
    }

    .nearby.option em { color: var(--option); }
    .nearby.shop em { color: var(--shop); }

    .eat-marker {
      position: relative;
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .eat-marker-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--eat);
      border: 2px solid #fffdf8;
      box-shadow: 0 0 0 1px rgba(192, 86, 42, 0.25);
    }

    .eat-marker-label {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      background: #fffdf8;
      border: 1px solid #e3c8b4;
      color: var(--eat);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      line-height: 1;
      padding: 3px 6px;
    }

    .map-wrap { position: relative; min-height: 0; }
    #map { height: 100%; width: 100%; background: #efe4c8; }

    .legend {
      position: absolute;
      left: 12px;
      bottom: 12px;
      z-index: 500;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 10px;
      background: rgba(255, 253, 248, 0.94);
      border: 1px solid var(--line);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      color: var(--muted);
    }

    .legend span::before {
      content: "";
      display: inline-block;
      width: 8px;
      height: 8px;
      margin-right: 6px;
      border-radius: 50%;
      background: var(--ink);
    }

    .legend .hotel::before { background: var(--hotel); }
    .legend .transit::before { background: var(--transit); }
    .legend .paris::before { background: var(--paris); }
    .legend .london::before { background: var(--london); }
    .legend .eat::before { background: #c47858; }
    .legend .option::before { background: var(--option); }
    .legend .shop::before { background: var(--shop); }
    .legend .leg::before {
      width: 14px;
      height: 3px;
      border-radius: 2px;
    }
    .legend .leg.walk::before { background: var(--walk); }
    .legend .leg.transit::before { background: var(--ride); }
    .legend .leg.uber::before { background: var(--uber); }
    .legend .leg.cycle::before { background: var(--cycle); }
    .legend .leg.loop::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--loop);
      border: 0;
    }

    .rec-marker {
      position: relative;
      width: 12px;
      height: 12px;
      cursor: pointer;
    }

    .rec-marker.must { width: 16px; height: 16px; }

    .rec-marker-dot {
      width: 10px;
      height: 10px;
      margin: 1px;
      background: #6b3d6a;
      border: 2px solid #fffdf8;
      transform: rotate(45deg);
      box-shadow: 0 0 0 1px rgba(107, 61, 106, 0.25);
    }

    .rec-marker.must .rec-marker-dot {
      width: 12px;
      height: 12px;
      margin: 2px;
      background: #8b3d2e;
      box-shadow: 0 0 0 1px rgba(139, 61, 46, 0.3);
    }

    .rec-marker-label {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      background: #fffdf8;
      border: 1px solid #e3c8b4;
      color: #8b3d2e;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 11px;
      line-height: 1;
      padding: 3px 6px;
    }

    .dot {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      border-radius: 50%;
      background: var(--ink);
      color: #fffdf8;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 10px;
      font-weight: 600;
      line-height: 18px;
      text-align: center;
    }

    .dot.hotel { background: var(--hotel); }
    .dot.paris { background: var(--paris); }
    .dot.london { background: var(--london); }
    .dot.transit { background: var(--transit); }
    .dot.meal { background: var(--eat); }

    .maplibregl-popup-content {
      max-width: 240px;
      padding: 10px 12px;
      border-radius: 2px;
      box-shadow: none;
      border: 1px solid var(--line);
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    .maplibregl-popup-content strong {
      display: block;
      margin-bottom: 4px;
      font-family: Georgia, serif;
      font-size: 15px;
    }

    .maplibregl-popup-content .pop-about {
      margin: 0 0 6px;
    }

    .maplibregl-popup-content .pop-hours {
      margin: 0 0 6px;
      font-size: 12px;
    }

    .maplibregl-popup-content .pop-meta {
      display: block;
      color: #6b6458;
      font-size: 12px;
    }

    .maplibregl-popup-anchor-bottom .maplibregl-popup-tip {
      border-top-color: var(--line);
    }

    .maplibregl-ctrl-attrib {
      font-size: 10px;
    }

    .all-trips {
      display: inline-block;
      margin-bottom: 8px;
      font-family: "Avenir Next", "Helvetica Neue", sans-serif;
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
    }

    .view-toggle {
      display: none;
    }

    @media (max-width: 860px) {
      .app {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr);
        height: 100dvh;
        max-width: 100%;
      }

      .sidebar,
      .map-wrap {
        grid-area: 1 / 1;
      }

      .sidebar {
        border-right: 0;
        min-width: 0;
        max-width: 100%;
        padding-top: calc(58px + env(safe-area-inset-top));
      }

      .brand {
        padding: 12px 16px 10px;
      }

      .brand h1 { font-size: 22px; }

      .days {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 40;
        flex-wrap: nowrap;
        gap: 8px;
        width: 100%;
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
        overscroll-behavior-x: contain;
        -webkit-overflow-scrolling: touch;
        padding: calc(8px + env(safe-area-inset-top)) 12px 8px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
        scrollbar-width: none;
      }

      .days::-webkit-scrollbar { display: none; }

      .days button {
        min-height: 40px;
        padding: 8px 14px;
        font-size: 13px;
      }

      .detail {
        padding: 14px 16px calc(92px + env(safe-area-inset-bottom));
      }

      .map-wrap { display: none; height: 100%; }

      body.map-mode .brand,
      body.map-mode .detail { display: none; }

      body.map-mode .sidebar {
        display: flex;
        align-self: start;
        height: auto;
        padding: 0;
        overflow: visible;
        background: transparent;
        pointer-events: none;
      }

      body.map-mode .days { pointer-events: auto; }

      body.map-mode .map-wrap {
        display: block;
        min-height: 0;
        height: 100%;
        padding-top: calc(58px + env(safe-area-inset-top));
      }

      .legend {
        left: 10px;
        right: 10px;
        bottom: calc(76px + env(safe-area-inset-bottom));
        gap: 8px 12px;
      }

      .maplibregl-ctrl-top-right {
        top: 8px;
      }

      .view-toggle {
        display: flex;
        position: fixed;
        z-index: 30;
        left: 50%;
        bottom: calc(14px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        gap: 4px;
        padding: 4px;
        background: rgba(255, 253, 248, 0.96);
        border: 1px solid var(--line);
        border-radius: 999px;
        box-shadow: 0 8px 24px rgba(28, 25, 20, 0.14);
      }

      .view-toggle button {
        min-width: 88px;
        min-height: 44px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--ink);
        font-family: "Avenir Next", "Helvetica Neue", sans-serif;
        font-size: 14px;
        cursor: pointer;
      }

      .view-toggle button.active {
        background: var(--ink);
        color: #fffdf8;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <a class="all-trips" href="../">All trips</a>
        <p>Trip map</p>
        <h1>Paris, then London</h1>
        <div class="dates">28 Oct – 8 Nov 2026 · map v64</div>
      </div>
      <div class="days" id="day-nav"></div>
      <div class="detail" id="detail"></div>
    </aside>
    <div class="map-wrap">
      <div id="map"></div>
      <div class="legend">
        <span class="hotel">Hotel</span>
        <span class="transit">Airport / station</span>
        <span class="paris">Paris stop</span>
        <span class="london">London stop</span>
        <span class="eat">Food · 15 min</span>
        <span class="shop">Shops · 10 min</span>
        <span class="option">Optional · 20 min</span>
        <span class="leg walk">Walk</span>
        <span class="leg transit">Transit</span>
        <span class="leg uber">Consider a car</span>
        <span class="leg cycle">Cycle</span>
        <span class="leg loop">Cycle around</span>
      </div>
    </div>
  </div>
  <nav class="view-toggle" aria-label="Plan or map">
    <button type="button" id="show-plan" class="active">Plan</button>
    <button type="button" id="show-map">Map</button>
  </nav>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    let places = {};
    let days = [];
    let hops = { prefer: {}, known: {} };

    const colors = {
      hotel: "#8b3d2e",
      transit: "#8a6a2f",
      nearby: "#8b9198",
      eat: "#c0562a",
      paris: "#3d5a4c",
      london: "#2d4a6f",
      flight: "#2d4a6f",
      train: "#6b6458",
      city: "#6b6458",
    };

    const map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      attributionControl: true,
      maxZoom: 15,
    });

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");

    const showPlan = document.getElementById("show-plan");
    const showMap = document.getElementById("show-map");
    function setPhoneView(mode) {
      const mapOn = mode === "map";
      document.body.classList.toggle("map-mode", mapOn);
      showPlan.classList.toggle("active", !mapOn);
      showMap.classList.toggle("active", mapOn);
      if (mapOn) requestAnimationFrame(() => map.resize());
    }
    showPlan.addEventListener("click", () => setPhoneView("plan"));
    showMap.addEventListener("click", () => setPhoneView("map"));
    window.addEventListener("resize", () => map.resize());

    let current = "overall";
    let popup = null;
    let mapReady = false;
    let dataReady = false;
    let recs = [];
    const FOOD = new Set(["Restaurants", "Nightlife", "Bakeries & sweets", "Street food"]);
    const FOOD_KM = 1.2;
    const SHOP_KM = 0.8;
    const OPTION_KM = 1.6;

    function emptyCollection() {
      return { type: "FeatureCollection", features: [] };
    }

    function uniqueStops(path) {
      const seen = new Set();
      return path.filter((id) => {
        if (seen.has(id)) return false;
        seen.add(id);
        return true;
      });
    }

    function hopInfo(fromId, toId) {
      const key = `${fromId}|${toId}`;
      if (hops.prefer[key]) return { mode: hops.prefer[key][0], text: hops.prefer[key][1] };
      const text = hops.known[key] || (() => {
        const km = kmBetween(places[fromId], places[toId]);
        const walkMins = Math.max(1, Math.round(km / 0.08));
        if (walkMins <= 18) return `${walkMins} min walk`;
        return `${Math.max(15, Math.round(10 + km * 5))} min metro`;
      })();
      return { mode: hopMode(text), text };
    }

    function hopMode(text) {
      const label = text.toLowerCase();
      if (label.includes("cycle") || label.includes("bike")) return "cycle";
      if (label.includes("car") || label.includes("taxi") || label.includes("uber")) return "uber";
      if (label.includes("walk") && !label.includes("metro") && !label.includes("tube") && !label.includes("rer")) return "walk";
      return "transit";
    }

    function hopLabel(fromId, toId) {
      return hopInfo(fromId, toId).text;
    }

    function placeLabel(id, fallback) {
      return places[id] ? places[id].label : fallback;
    }

    function eventHops(day, index) {
      const events = day.events || [];
      const curr = events[index];
      if (!curr || curr.meal) return null;
      const stopBefore = events.slice(0, index).reverse().find((item) => !item.meal);
      if (!stopBefore || stopBefore.id === curr.id) return null;
      const hop = hopInfo(stopBefore.id, curr.id);
      return {
        text: hop.text,
        mode: hop.mode,
        fromName: placeLabel(stopBefore.id, stopBefore.title),
      };
    }

    function mapNumber(day, placeId) {
      const idx = uniqueStops(day.loop).indexOf(placeId);
      return idx >= 0 ? idx + 1 : "·";
    }

    function whenLabel(event) {
      if (!event || !event.from) return "";
      if (!event.to || event.to === "—") return event.from;
      return `${event.from}–${event.to}`;
    }

    function segmentMode(fromId, toId) {
      return hopInfo(fromId, toId).mode;
    }

    function lngLat(id) {
      const place = places[id];
      return [place.lng, place.lat];
    }

    function kmBetween(a, b) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(b.lat - a.lat);
      const dLng = toRad(b.lng - a.lng);
      const sin = Math.sin(dLat / 2) ** 2
        + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * Math.sin(dLng / 2) ** 2;
      return 6371 * 2 * Math.asin(Math.sqrt(sin));
    }

    function normalizeName(value) {
      return String(value || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]+/g, " ")
        .trim();
    }

    function shortLabel(name) {
      return name
        .split("|")[0]
        .replace(/ - Boutique hôtel.*$/i, "")
        .replace(/ - Paris \d+$/i, "")
        .replace(/^The /, "")
        .trim();
    }

    function alreadyOnLoop(pin, stopIds) {
      return stopIds.some((id) => {
        const place = places[id];
        if (kmBetween(pin, place) < 0.05) return true;
        const pinName = normalizeName(pin.name);
        const label = normalizeName(place.label);
        const full = normalizeName(place.name);
        if (label.length > 3 && pinName.includes(label)) return true;
        if (full.length > 6 && (pinName.includes(full) || full.includes(pinName))) return true;
        return false;
      });
    }

    function anchorStops(day) {
      if (!day || day.id === "overall" || day.id === "nov7") return [];
      return uniqueStops(day.loop).filter((id) => {
        if (places[id].kind === "transit") return false;
        if (day.id === "nov3" && places[id].city === "Paris") return false;
        return true;
      });
    }

    function collectPins(day, options) {
      const anchors = anchorStops(day);
      if (!anchors.length) return [];
      const stopIds = uniqueStops(day.loop);
      const matches = [];
      recs.forEach((rec) => {
        if (options.categories && !options.categories.has(rec.category)) return;
        if (options.source && rec.source !== options.source) return;
        if (options.excludeSource && rec.source === options.excludeSource) return;
        if (options.priority && rec.priority !== options.priority) return;
        if (!options.categories && !options.source && FOOD.has(rec.category)) return;
        const lat = Number(rec.lat);
        const lng = Number(rec.lng);
        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;
        const pin = { name: rec.name, lat, lng };
        if (alreadyOnLoop(pin, stopIds)) return;
        if (options.skipPlanned && plannedElsewhere(pin)) return;
        let best = null;
        anchors.forEach((id) => {
          if (places[id].city !== rec.city) return;
          const km = kmBetween(pin, places[id]);
          if (km <= options.maxKm && (!best || km < best.km)) best = { id, km };
        });
        if (!best) return;
        const branch = rec.branch ? ` · ${rec.branch}` : "";
        matches.push({
          name: rec.name + branch,
          label: shortLabel(rec.name),
          category: rec.category,
          what: rec.what || "",
          hours: rec.hours || "",
          priority: rec.priority,
          lat,
          lng,
          nearId: best.id,
          km: best.km,
          mins: Math.max(1, Math.round(best.km / 0.08)),
        });
      });
      matches.sort((a, b) => a.km - b.km);
      const seen = [];
      return matches.filter((item) => {
        const key = normalizeName(item.label);
        const duplicate = seen.find((other) => other.key === key && kmBetween(item, other) < 0.12);
        if (duplicate) return false;
        seen.push({ key, lat: item.lat, lng: item.lng });
        return true;
      });
    }

    function plannedElsewhere(pin) {
      return days.some((day) => day.id !== "overall" && alreadyOnLoop(pin, uniqueStops(day.loop)));
    }

    function foodPins(day) {
      return collectPins(day, { categories: FOOD, maxKm: FOOD_KM, skipPlanned: true });
    }

    function shopPins(day) {
      return collectPins(day, { source: "shopping", maxKm: SHOP_KM, skipPlanned: true });
    }

    function optionPins(day) {
      return collectPins(day, { priority: "random", excludeSource: "shopping", maxKm: OPTION_KM, skipPlanned: true });
    }

    function eatsForStop(eats, placeId) {
      return eats.filter((item) => item.nearId === placeId);
    }

    function pinFeatures(items) {
      return items.map((item) => ({
        type: "Feature",
        properties: {
          name: item.name,
          label: item.label,
          category: item.category,
          what: item.what,
          hours: item.hours || "",
          note: `${item.mins} min walk from ${places[item.nearId].label}`,
        },
        geometry: { type: "Point", coordinates: [item.lng, item.lat] },
      }));
    }

    function routeFeatures(path) {
      const features = [];
      for (let i = 0; i < path.length - 1; i += 1) {
        features.push({
          type: "Feature",
          properties: { mode: segmentMode(path[i], path[i + 1]) },
          geometry: {
            type: "LineString",
            coordinates: [lngLat(path[i]), lngLat(path[i + 1])],
          },
        });
      }
      return features;
    }

    function stopFeatures(day) {
      return uniqueStops(day.loop).map((id, i) => {
        const place = places[id];
        const when = (day.events || [])
          .filter((item) => item.id === id && !item.meal)
          .map(whenLabel)
          .filter(Boolean)
          .join(" · ");
        const what = (day.events || [])
          .filter((item) => item.id === id && !item.meal && item.text)
          .map((item) => item.text)
          .sort((a, b) => b.length - a.length)[0] || place.note;
        return {
          type: "Feature",
          properties: {
            num: String(i + 1),
            name: place.name,
            label: place.label,
            kind: place.kind,
            note: what,
            about: place.about || place.note,
            hours: place.hours || "",
            cycleLoop: place.cycleLoop === true,
            city: place.city,
            when,
          },
          geometry: { type: "Point", coordinates: lngLat(id) },
        };
      });
    }

    function kindColor() {
      return [
        "match",
        ["get", "kind"],
        "hotel", colors.hotel,
        "transit", colors.transit,
        "paris", colors.paris,
        "london", colors.london,
        colors.nearby,
      ];
    }

    function renderSidebar(day, food, options, shops) {
      const events = day.events && day.events.length
        ? day.events
        : uniqueStops(day.loop).map((id) => ({ id, title: places[id].name, text: places[id].note }));
      document.querySelectorAll("#day-nav button").forEach((btn) => {
        const on = btn.dataset.id === day.id;
        btn.classList.toggle("active", on);
        if (on) btn.scrollIntoView({ inline: "center", block: "nearest" });
      });
      const shownOptions = (options || []).slice(0, 8);
      const extraOptions = (options || []).length - shownOptions.length;
      const optionHtml = shownOptions.length
        ? `<p class="nearby option"><em>Within 20 min, not on today's plan</em>${shownOptions.map((item) => `${esc(item.label)} · ${item.mins} min`).join("<br>")}${extraOptions > 0 ? `<br>+ ${extraOptions} more on the map` : ""}</p>`
        : "";
      document.getElementById("detail").innerHTML = `
        <p class="kicker">${day.kicker}</p>
        <h2>${day.title}</h2>
        <p class="lede">${day.lede}</p>
        ${events.map((event, i) => {
          const place = places[event.id];
          const num = mapNumber(day, event.id);
          const mark = event.meal === "breakfast" ? "B" : event.meal === "lunch" ? "L" : event.meal === "dinner" ? "D" : String(num);
          const allNearby = event.pause ? [] : eatsForStop(food, event.id);
          const nearby = allNearby.slice(0, 4);
          const more = allNearby.length - nearby.length;
          const shopHere = event.pause ? [] : eatsForStop(shops || [], event.id);
          const shopShown = shopHere.slice(0, 3);
          const shopMore = shopHere.length - shopShown.length;
          const hops = eventHops(day, i);
          const when = whenLabel(event);
          const hopHtml = hops
            ? `<p class="hops"><span class="hop ${hops.mode}">${esc(hops.text)} from ${esc(hops.fromName)}</span></p>`
            : "";
          const nearbyHtml = nearby.length
            ? `<p class="nearby"><em>15 min walk</em>${nearby.map((item) => `${esc(item.label)} · ${item.mins} min`).join("<br>")}${more > 0 ? `<br>+ ${more} more on the map` : ""}</p>`
            : "";
          const shopHtml = shopShown.length
            ? `<p class="nearby shop"><em>10 min walk</em>${shopShown.map((item) => `${esc(item.label)} · ${item.mins} min`).join("<br>")}${shopMore > 0 ? `<br>+ ${shopMore} more on the map` : ""}</p>`
            : "";
          return `
            <article class="event">
              <div class="dot ${event.meal ? "meal" : (place ? place.kind : "hotel")}">${mark}</div>
              <div>
                <h3>${event.meal ? event.title : `${num}. ${event.title}`}</h3>
                ${when ? `<p class="when">${when}</p>` : ""}
                ${hopHtml}
                <p>${event.text}</p>
                ${nearbyHtml}
                ${shopHtml}
              </div>
            </article>
          `;
        }).join("")}
        ${optionHtml}
      `;
    }

    function esc(value) {
      return String(value || "").replace(/[&<>"]/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
      }[ch]));
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let field = "";
      let quoted = false;
      for (let i = 0; i < text.length; i += 1) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else quoted = false;
          } else field += ch;
        } else if (ch === '"') quoted = true;
        else if (ch === ",") {
          row.push(field);
          field = "";
        } else if (ch === "\n") {
          row.push(field);
          rows.push(row);
          row = [];
          field = "";
        } else if (ch !== "\r") field += ch;
      }
      if (field.length || row.length) {
        row.push(field);
        rows.push(row);
      }
      const header = rows.shift() || [];
      return rows
        .filter((cells) => cells.length === header.length && cells.some(Boolean))
        .map((cells) => Object.fromEntries(header.map((key, index) => [key, cells[index]])));
    }

    function renderDay(id) {
      current = id;
      const day = days.find((d) => d.id === id);
      const path = day.loop;
      const food = foodPins(day);
      const shops = shopPins(day);
      const options = optionPins(day);
      renderSidebar(day, food, options, shops);
      if (!mapReady) return;

      if (popup) {
        popup.remove();
        popup = null;
      }

      map.getSource("routes").setData({ type: "FeatureCollection", features: routeFeatures(path) });
      map.getSource("stops").setData({ type: "FeatureCollection", features: stopFeatures(day) });
      map.getSource("food").setData({ type: "FeatureCollection", features: pinFeatures(food) });
      map.getSource("shops").setData({ type: "FeatureCollection", features: pinFeatures(shops) });
      map.getSource("options").setData({ type: "FeatureCollection", features: pinFeatures(options) });

      const bounds = new maplibregl.LngLatBounds();
      uniqueStops(day.loop).forEach((placeId) => bounds.extend(lngLat(placeId)));
      food.forEach((item) => bounds.extend([item.lng, item.lat]));
      shops.forEach((item) => bounds.extend([item.lng, item.lat]));
      options.forEach((item) => bounds.extend([item.lng, item.lat]));
      map.fitBounds(bounds, {
        padding: { top: 64, right: 140, bottom: 52, left: 48 },
        maxZoom: id === "overall" ? 6.4 : 13.4,
        duration: 0,
      });
    }

    map.on("load", () => {
      map.setPaintProperty("background", "background-color", "#efe4c8");
      if (map.getLayer("natural_earth")) {
        map.setPaintProperty("natural_earth", "raster-opacity", 0);
      }
      map.setPaintProperty("water", "fill-color", "#6ea8dc");
      ["waterway_river", "waterway_other", "waterway_tunnel"].forEach((id) => {
        if (map.getLayer(id)) map.setPaintProperty(id, "line-color", "#6ea8dc");
      });
      map.setPaintProperty("park", "fill-color", "#a8d48a");
      map.setPaintProperty("park", "fill-opacity", 0.9);
      if (map.getLayer("landcover_grass")) {
        map.setPaintProperty("landcover_grass", "fill-color", "#b8d98c");
        map.setPaintProperty("landcover_grass", "fill-opacity", 0.55);
      }
      if (map.getLayer("landcover_wood")) {
        map.setPaintProperty("landcover_wood", "fill-color", "#88c070");
        map.setPaintProperty("landcover_wood", "fill-opacity", 0.55);
      }

      map.addSource("routes", { type: "geojson", data: emptyCollection() });
      map.addSource("stops", { type: "geojson", data: emptyCollection() });
      map.addSource("food", { type: "geojson", data: emptyCollection() });
      map.addSource("shops", { type: "geojson", data: emptyCollection() });
      map.addSource("options", { type: "geojson", data: emptyCollection() });
      map.addLayer({
        id: "routes-line",
        type: "line",
        source: "routes",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: {
          "line-color": ["match", ["get", "mode"],
            "walk", "#2f7d46",
            "transit", "#2d4a6f",
            "uber", "#c47b2a",
            "cycle", "#7b4dff",
            "#6b6458"],
          "line-width": 1.5,
          "line-opacity": 0.85,
        },
      });
      map.addLayer({
        id: "option-dot",
        type: "circle",
        source: "options",
        paint: {
          "circle-radius": 5,
          "circle-color": "#5c4d7a",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#fffdf8",
        },
      });
      map.addLayer({
        id: "option-label",
        type: "symbol",
        source: "options",
        minzoom: 12.4,
        layout: {
          "text-field": ["get", "label"],
          "text-size": 11,
          "text-font": ["Noto Sans Regular"],
          "text-anchor": "left",
          "text-offset": [0.75, 0],
          "text-optional": true,
        },
        paint: {
          "text-color": "#5c4d7a",
          "text-halo-color": "#fffdf8",
          "text-halo-width": 1.4,
        },
      });
      map.addLayer({
        id: "food-dot",
        type: "circle",
        source: "food",
        paint: {
          "circle-radius": 5,
          "circle-color": "#c47858",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#fffdf8",
        },
      });
      map.addLayer({
        id: "food-label",
        type: "symbol",
        source: "food",
        minzoom: 12.4,
        layout: {
          "text-field": ["get", "label"],
          "text-size": 11,
          "text-font": ["Noto Sans Regular"],
          "text-anchor": "left",
          "text-offset": [0.7, 0],
          "text-optional": true,
        },
        paint: {
          "text-color": "#a85c42",
          "text-halo-color": "#fffdf8",
          "text-halo-width": 1.4,
        },
      });
      map.addLayer({
        id: "shop-dot",
        type: "circle",
        source: "shops",
        paint: {
          "circle-radius": 5,
          "circle-color": "#c23b73",
          "circle-stroke-width": 2,
          "circle-stroke-color": "#fffdf8",
        },
      });
      map.addLayer({
        id: "shop-label",
        type: "symbol",
        source: "shops",
        minzoom: 12.4,
        layout: {
          "text-field": ["get", "label"],
          "text-size": 11,
          "text-font": ["Noto Sans Regular"],
          "text-anchor": "left",
          "text-offset": [0.75, 0],
          "text-optional": true,
        },
        paint: {
          "text-color": "#c23b73",
          "text-halo-color": "#fffdf8",
          "text-halo-width": 1.4,
        },
      });
      map.addLayer({
        id: "stops-halo",
        type: "circle",
        source: "stops",
        paint: {
          "circle-radius": 11,
          "circle-color": "#fffdf8",
          "circle-stroke-width": 0,
        },
      });
      map.addLayer({
        id: "stops-dot",
        type: "circle",
        source: "stops",
        paint: {
          "circle-radius": 9,
          "circle-color": kindColor(),
          "circle-stroke-width": 0,
        },
      });
      map.addLayer({
        id: "stops-num",
        type: "symbol",
        source: "stops",
        layout: {
          "text-field": ["get", "num"],
          "text-size": 11,
          "text-font": ["Noto Sans Regular"],
          "text-allow-overlap": true,
          "text-ignore-placement": true,
        },
        paint: {
          "text-color": "#fffdf8",
        },
      });
      map.addLayer({
        id: "stops-loop",
        type: "circle",
        source: "stops",
        filter: ["==", ["get", "cycleLoop"], true],
        paint: {
          "circle-radius": 4,
          "circle-color": "#2f7de1",
          "circle-stroke-width": 1.5,
          "circle-stroke-color": "#fffdf8",
          "circle-translate": [-8, -8],
          "circle-translate-anchor": "viewport",
        },
      });
      map.addLayer({
        id: "stops-label",
        type: "symbol",
        source: "stops",
        minzoom: 11.2,
        layout: {
          "text-field": ["get", "label"],
          "text-size": 12,
          "text-font": ["Noto Sans Regular"],
          "text-anchor": "top",
          "text-offset": [0, 0.85],
          "text-allow-overlap": true,
          "text-ignore-placement": true,
        },
        paint: {
          "text-color": "#2b2a28",
          "text-halo-color": "#fffdf8",
          "text-halo-width": 1.6,
        },
      });

      const pinLayers = [
        "stops-label", "stops-num", "stops-loop", "stops-dot",
        "food-label", "food-dot", "shop-label", "shop-dot", "option-label", "option-dot",
      ];
      function esc(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function popupHtml(props) {
        if (props.num) {
          const meta = [props.when, props.city].filter(Boolean).join(" · ");
          const hours = props.hours ? `<p class="pop-hours">${esc(props.hours)}</p>` : "";
          return `<strong>${esc(props.num)}. ${esc(props.name)}</strong><p class="pop-about">${esc(props.about)}</p>${hours}${meta ? `<span class="pop-meta">${esc(meta)}</span>` : ""}`;
        }
        const meta = [props.category, props.note].filter(Boolean).join(" · ");
        const hours = props.hours ? `<p class="pop-hours">${esc(props.hours)}</p>` : "";
        return `<strong>${esc(props.name)}</strong><p class="pop-about">${esc(props.what)}</p>${hours}${meta ? `<span class="pop-meta">${esc(meta)}</span>` : ""}`;
      }
      map.on("click", (event) => {
        const hits = map.queryRenderedFeatures(event.point, { layers: pinLayers });
        if (!hits.length) {
          if (popup) popup.remove();
          return;
        }
        const feature = hits[0];
        if (popup) popup.remove();
        popup = new maplibregl.Popup({ offset: 16, closeButton: false, maxWidth: "260px" })
          .setLngLat(feature.geometry.coordinates)
          .setHTML(popupHtml(feature.properties))
          .addTo(map);
      });
      pinLayers.forEach((layerId) => {
        map.on("mouseenter", layerId, () => { map.getCanvas().style.cursor = "pointer"; });
        map.on("mouseleave", layerId, () => { map.getCanvas().style.cursor = ""; });
      });

      mapReady = true;
      if (dataReady) renderDay(current);
    });

    function boot(data) {
      places = data.places;
      days = data.days;
      hops = data.hops;
      dataReady = true;
      const nav = document.getElementById("day-nav");
      days.forEach((day) => {
        const btn = document.createElement("button");
        btn.dataset.id = day.id;
        btn.textContent = day.label;
        btn.addEventListener("click", () => renderDay(day.id));
        nav.appendChild(btn);
      });
      renderDay("overall");
      fetch("recs.csv?v=64")
        .then((response) => response.text())
        .then((text) => {
          recs = parseCsv(text);
          if (mapReady) renderDay(current);
        })
        .catch(() => {});
    }

    fetch("trip.json?v=64")
      .then((response) => {
        if (!response.ok) throw new Error("trip.json");
        return response.json();
      })
      .then(boot)
      .catch(() => {});
  </script>
</body>
